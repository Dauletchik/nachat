<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GRAM App</title>

<style>
body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.phone{
    width:300px;
    height:600px;
    background:#111;
    border-radius:30px;
    padding:15px;
    box-shadow:0 0 30px purple;
}

.screen{
    width:100%;
    height:100%;
    background:white;
    border-radius:20px;
    overflow:hidden;
}

.header{
    background:#6200ff;
    color:white;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

.app{
    padding:20px;
    text-align:center;
}

.btn{
    background:#6200ff;
    color:white;
    padding:10px;
    border-radius:10px;
    margin-top:20px;
}
</style>

</head>
<body>

<div class="phone">
    <div class="screen">

        <div class="header">
            Play Market
        </div>

        <div class="app">
            <h2>GRAM</h2>
            <p>Official App</p>

            <div class="btn">
                Install
            </div>

        </div>

    </div>
</div>

</body>
</html>
